<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Runner</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1a1a1a;--mu:#6b6b66;--ac:#d62828;--ok:#2a9d4f;--bd:#e0e0da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mu:#9a9a94;--ac:#ff5a5f;--ok:#4cc76f;--bd:#333}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mu:#9a9a94;--ac:#ff5a5f;--ok:#4cc76f;--bd:#333}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:14px}
h1{margin:4px 0 0;font-size:1.3rem;letter-spacing:.5px}
h1 span{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:4px}
input[type=number]{width:100%;font-size:1.1rem;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-top:10px;color:var(--tx)}
#disp{text-align:center}
#lvl{font-size:.95rem;color:var(--mu)}
#time{font-size:clamp(4rem,22vw,8rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0}
#time.warn{color:var(--ac)}
#mins{font-size:1.1rem;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;width:0;background:var(--ac);transition:width .3s}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{flex:1;min-width:90px;font-size:1.05rem;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4}
#list{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 10px;border-radius:20px;border:1px solid var(--bd);font-size:.85rem;color:var(--mu)}
.pill.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.cur{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#sum{font-size:.85rem;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>LAST <span>RUNNER</span></h1>

<section class="card" id="cfg">
  <div class="grid">
    <div><label for="start">Départ (min)</label><input id="start" type="number" min="1" max="180" value="20"></div>
    <div><label for="end">Arrivée (min)</label><input id="end" type="number" min="1" max="180" value="4"></div>
    <div><label for="step">Pas (min)</label><input id="step" type="number" min="1" max="60" value="1"></div>
    <div><label for="reps">Répétitions par durée</label><input id="reps" type="number" min="1" max="20" value="1"></div>
    <div><label for="rest">Pause entre tours (s)</label><input id="rest" type="number" min="0" max="600" value="0"></div>
  </div>
  <label class="chk"><input type="checkbox" id="sound" checked> Son &amp; vibration</label>
  <div id="sum"></div>
</section>

<section class="card" id="disp">
  <div id="lvl">Prêt</div>
  <div id="time">20:00</div>
  <div id="mins">—</div>
  <div class="bar"><div id="prog"></div></div>
  <div class="btns">
    <button id="go">Démarrer</button>
    <button id="skip" class="sec" disabled>Tour suivant</button>
    <button id="reset" class="sec">Réinitialiser</button>
  </div>
</section>

<section class="card"><div id="list"></div></section>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const F=['start','end','step','reps','rest'];
let plan=[],idx=0,state='idle',endAt=0,leftMs=0,lapMs=0,resting=false,tick=null,wake=null,actx=null,lastBeepSec=-1;

try{const s=JSON.parse(localStorage.getItem('lr')||'{}');F.forEach(k=>{if(s[k]!=null)$(k).value=s[k]});if(s.sound===false)$('sound').checked=false}catch(e){}

function val(k){return Math.max(0,parseInt($(k).value,10)||0)}
function save(){try{const o={sound:$('sound').checked};F.forEach(k=>o[k]=val(k));localStorage.setItem('lr',JSON.stringify(o))}catch(e){}}

function build(){
  const s=val('start'),e=val('end'),st=Math.max(1,val('step')),r=Math.max(1,val('reps'));
  plan=[];
  if(s<1||e<1)return;
  if(s>=e){for(let m=s;m>=e;m-=st)for(let i=1;i<=r;i++)plan.push({m,i})}
  else{for(let m=s;m<=e;m+=st)for(let i=1;i<=r;i++)plan.push({m,i})}
}
function fmt(ms){const t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function total(){return plan.reduce((a,p)=>a+p.m,0)}

function renderList(){
  $('list').innerHTML=plan.map((p,i)=>{
    const c=i<idx?'done':(i===idx&&state!=='idle'?'cur':'');
    return '<span class="pill '+c+'">'+p.m+' min'+(val('reps')>1?' ('+p.i+')':'')+'</span>';
  }).join('');
  const t=total(),h=Math.floor(t/60);
  $('sum').textContent=plan.length+' tours · durée totale '+(h?h+' h ':'')+(t%60)+' min'+(val('rest')?' (hors pauses)':'');
}
function renderIdle(){
  build();idx=0;state='idle';resting=false;
  const p=plan[0];
  $('time').textContent=p?fmt(p.m*60000):'--:--';
  $('time').classList.remove('warn');
  $('lvl').textContent=p?'Prêt · tour 1/'+plan.length:'Paramètres invalides';
  $('mins').textContent=p?p.m+' min':'—';
  $('prog').style.width='0';
  $('go').textContent='Démarrer';$('skip').disabled=true;
  renderList();
}
function setLap(){
  const p=plan[idx];resting=false;lapMs=p.m*60000;leftMs=lapMs;
  $('lvl').textContent='Tour '+(idx+1)+'/'+plan.length+(val('reps')>1?' · répétition '+p.i+'/'+val('reps'):'');
  $('mins').textContent=p.m+' min';
  renderList();
}
function beep(f,d){
  if(!$('sound').checked)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}
function vib(p){if($('sound').checked&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

function start(){
  if(!plan.length)return;
  if(state==='idle'){idx=0;setLap()}
  state='run';endAt=Date.now()+leftMs;lastBeepSec=-1;
  $('go').textContent='Pause';$('skip').disabled=false;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  clearInterval(tick);tick=setInterval(loop,200);loop();
}
function pause(){
  state='pause';leftMs=Math.max(0,endAt-Date.now());clearInterval(tick);
  $('go').textContent='Reprendre';
  try{if(wake){wake.release();wake=null}}catch(e){}
}
function next(){
  if(resting){setLap();endAt=Date.now()+leftMs;lastBeepSec=-1;renderList();return}
  idx++;
  if(idx>=plan.length){finish();return}
  const r=val('rest');
  if(r>0){
    resting=true;lapMs=r*1000;leftMs=lapMs;endAt=Date.now()+leftMs;lastBeepSec=-1;
    $('lvl').textContent='Pause · prochain tour : '+plan[idx].m+' min';
    $('mins').textContent='Repos';
    renderList();
  }else{setLap();endAt=Date.now()+leftMs;lastBeepSec=-1}
}
function finish(){
  clearInterval(tick);state='done';idx=plan.length;
  $('lvl').textContent='Terminé 🏁';$('time').textContent='00:00';$('time').classList.remove('warn');
  $('mins').textContent=plan.length+' tours effectués';$('prog').style.width='100%';
  $('go').textContent='Recommencer';$('skip').disabled=true;
  beep(520,.25);setTimeout(()=>beep(780,.5),300);vib([300,100,300,100,600]);
  try{if(wake){wake.release();wake=null}}catch(e){}
  renderList();
}
function loop(){
  leftMs=Math.max(0,endAt-Date.now());
  const sec=Math.ceil(leftMs/1000);
  $('time').textContent=fmt(leftMs);
  $('time').classList.toggle('warn',sec<=10&&!resting);
  $('prog').style.width=(100*(1-leftMs/lapMs))+'%';
  if(sec<=3&&sec>=1&&sec!==lastBeepSec){lastBeepSec=sec;beep(660,.12);vib(60)}
  if(leftMs<=0){beep(880,.5);vib([400]);next()}
}

$('go').onclick=()=>{
  if(state==='run')pause();
  else if(state==='done'){renderIdle();start()}
  else start();
};
$('skip').onclick=()=>{if(state==='run'||state==='pause'){const was=state;if(resting){resting=false}else{idx++;}
  if(idx>=plan.length){finish();return}
  setLap();if(was==='run'){endAt=Date.now()+leftMs;lastBeepSec=-1}else{$('time').textContent=fmt(leftMs)}}};
$('reset').onclick=()=>{clearInterval(tick);try{if(wake){wake.release();wake=null}}catch(e){}renderIdle()};
F.forEach(k=>$(k).addEventListener('input',()=>{save();if(state==='idle'||state==='done')renderIdle()}));
$('sound').addEventListener('change',save);
document.addEventListener('visibilitychange',()=>{if(state==='run'){loop();try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}});
renderIdle();
})();
</script>
</body>
</html>
